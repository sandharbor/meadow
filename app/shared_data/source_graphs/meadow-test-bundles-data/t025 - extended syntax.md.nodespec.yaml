nodespecs:
  - bundle: meadow-test-bundle-big
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /t003 ---- page with section to link to.md
            isInGraph: true
        inlinks:
          - linkPath: /main page.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: "#footnote-1"
          - relativeLinkPath: "#footnote-bignote"
          - relativeLinkPath: "#footnote-ref-1"
          - relativeLinkPath: "#footnote-ref-bignote"
          - relativeLinkPath: http://www.example.com
          - relativeLinkPath: https://www.markdownguide.org
          - relativeLinkPath: https://www.markdownguide.org/extended-syntax/
          - relativeLinkPath: https://example.com/callout-title
          - relativeLinkPath: https://example.com/definition
          - relativeLinkPath: https://example.com/embedded
          - relativeLinkPath: https://example.com/camp:tent:site
          - relativeLinkPath: "#footnote-inline-1"
          - relativeLinkPath: "#footnote-ref-inline-1"
        footerSectionBacklinks:
          - relativeLinkPath: main page.html
            backlinkContexts:
              - seeInContextLinkRelativePath: main page.html
                embeddedLinks: []
  - bundle: meadow-test-bundle-small
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: null
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
