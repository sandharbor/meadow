nodespecs:
  - bundle: meadow-test-bundle-big
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /t021/t021 ---- inlink gap.md
            isInGraph: true
          - linkPath: /t021/t021 ---- outlink gap.md
            isInGraph: true
        inlinks:
          - linkPath: /main page.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: t021/t021 ---- inlink gap.html
          - relativeLinkPath: t021/t021 ---- outlink gap.html
        footerSectionBacklinks:
          - relativeLinkPath: main page.html
            backlinkContexts:
              - seeInContextLinkRelativePath: main page.html
                embeddedLinks: []
  - bundle: meadow-test-bundle-small
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: null
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
