nodespecs:
  - bundle: meadow-test-bundle-big
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /t024 - markdown links.md
            isInGraph: true
          - linkPath: /t024/deeper/t024 ---- deep page.md
            isInGraph: true
        inlinks:
          - linkPath: /t024 - markdown links.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: ../t024 - markdown links.html
          - relativeLinkPath: deeper/t024 ---- deep page.html
        footerSectionBacklinks:
          - relativeLinkPath: ../t024 - markdown links.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../t024 - markdown links.html
                embeddedLinks: []
  - bundle: meadow-test-bundle-small
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: null
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
