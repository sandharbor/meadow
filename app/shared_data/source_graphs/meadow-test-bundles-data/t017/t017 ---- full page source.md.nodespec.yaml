nodespecs:
  - bundle: meadow-test-bundle-big
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /t017/t017 ---- block source.md
            isInGraph: true
          - linkPath: /t017/t017 ---- section source.md
            isInGraph: true
        inlinks:
          - linkPath: /t017/t017 ---- full page transclusion.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: t017 ---- block source.html
          - relativeLinkPath: t017 ---- block source.html
          - relativeLinkPath: t017 ---- section source.html
        footerSectionBacklinks:
          - relativeLinkPath: t017 ---- full page transclusion.html
            backlinkContexts:
              - seeInContextLinkRelativePath: t017 ---- full page transclusion.html
                embeddedLinks:
                  - linkName: ⤢
                    linkRelativePath: t017 ---- full page source.html
                  - linkName: the section source
                    linkRelativePath: t017 ---- section source.html
  - bundle: meadow-test-bundle-small
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: null
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
