nodespecs:
  - bundle: single-folder-bundle
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /Outside/Beyond outside.md
            isInGraph: true
        inlinks:
          - linkPath: /Alpha/Alpha note.md
            isInGraph: true
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: Beyond outside.html
        footerSectionBacklinks:
          - relativeLinkPath: ../Alpha/Alpha note.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../Alpha/Alpha note.html
                embeddedLinks:
                  - linkName: Nested note
                    linkRelativePath: ../Alpha/Nested/Nested note.html
  - bundle: ordered-folders
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /Outside/Beyond outside.md
            isInGraph: true
        inlinks:
          - linkPath: /Alpha/Alpha note.md
            isInGraph: true
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: Beyond outside.html
        footerSectionBacklinks:
          - relativeLinkPath: ../Alpha/Alpha note.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../Alpha/Alpha note.html
                embeddedLinks:
                  - linkName: Nested note
                    linkRelativePath: ../Alpha/Nested/Nested note.html
