nodespecs:
  - bundle: single-folder-bundle
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks: []
        inlinks:
          - linkPath: /Alpha/Alpha note.md
            isInGraph: true
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks:
          - relativeLinkPath: ../Alpha note.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../Alpha note.html
                embeddedLinks:
                  - linkName: Outside note
                    linkRelativePath: ../../Outside/Outside note.html
  - bundle: ordered-folders
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks: []
        inlinks:
          - linkPath: /Alpha/Alpha note.md
            isInGraph: true
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks:
          - relativeLinkPath: ../Alpha note.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../Alpha note.html
                embeddedLinks:
                  - linkName: Outside note
                    linkRelativePath: ../../Outside/Outside note.html
