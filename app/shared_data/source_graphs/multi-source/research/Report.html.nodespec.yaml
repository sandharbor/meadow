nodespecs:
  - bundle: multi-source-page
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - source: notes
            linkPath: /Overview.md
            isInGraph: true
          - linkPath: /diagram.svg
            isInGraph: true
          - source: reference
            linkPath: /Study.md
            isInGraph: true
        inlinks:
          - source: notes
            linkPath: /Start.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: ../notes/Overview.html
          - relativeLinkPath: diagram.svg
          - relativeLinkPath: ../reference/Study.html
        footerSectionBacklinks: []
  - bundle: multi-source-mixed
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - source: notes
            linkPath: /Overview.md
            isInGraph: true
          - linkPath: /diagram.svg
            isInGraph: true
          - source: reference
            linkPath: /Study.md
            isInGraph: true
        inlinks:
          - source: notes
            linkPath: /Start.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: ../notes/Overview.html
          - relativeLinkPath: diagram.svg
          - relativeLinkPath: ../reference/Study.html
        footerSectionBacklinks: []
  - bundle: multi-source-omitted
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: 1
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
