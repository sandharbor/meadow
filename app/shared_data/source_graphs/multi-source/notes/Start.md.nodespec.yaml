            linkPath: /Overview.md
            isInGraph: true
          - linkPath: /Same/Inside.md
            isInGraph: true
          - linkPath: /Frontier.md
            isInGraph: true
          - source: research
            linkPath: /Report.html
            isInGraph: true
          - source: research
            linkPath: /diagram.svg
            isInGraph: true
        inlinks:
          - source: research
            linkPath: /Overview.md
            isInGraph: true
          - source: research
            linkPath: /Incoming.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: Overview.html
          - relativeLinkPath: ../research/Overview.html
          - relativeLinkPath: Same/Inside.html
          - relativeLinkPath: Frontier.html
          - relativeLinkPath: ../research/Report.html#findings
          - relativeLinkPath: ../research/diagram.svg
        footerSectionBacklinks:
          - relativeLinkPath: ../research/Overview.html
