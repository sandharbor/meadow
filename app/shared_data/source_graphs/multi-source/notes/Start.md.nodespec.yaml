nodespecs:
  - bundle: multi-source-page
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - linkPath: /Overview.md
            isInGraph: true
          - source: research
            linkPath: /Overview.md
            isInGraph: true
          - linkPath: /Same/Inside.md
            isInGraph: true
          - linkPath: /Frontier.md
            isInGraph: true
          - source: research
            linkPath: /Report.html
            isInGraph: true
          - source: research
            linkPath: /diagram.svg
            isInGraph: true
        inlinks:
          - source: research
            linkPath: /Overview.md
            isInGraph: true
          - source: research
            linkPath: /Incoming.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: Overview.html
          - relativeLinkPath: ../research/Overview.html
          - relativeLinkPath: Same/Inside.html
          - relativeLinkPath: Frontier.html
          - relativeLinkPath: ../research/Report.html#findings
          - relativeLinkPath: ../research/diagram.svg
        footerSectionBacklinks:
          - relativeLinkPath: ../research/Overview.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../research/Overview.html
                embeddedLinks:
                  - linkName: Inside
                    linkRelativePath: ../research/Same/Inside.html
          - relativeLinkPath: ../research/Incoming.html
            backlinkContexts:
              - seeInContextLinkRelativePath: ../research/Incoming.html
                embeddedLinks:
                  - linkName: Overview
                    linkRelativePath: ../research/Overview.html
  - bundle: multi-source-mixed
    sourcing:
      isInWorkingGraph: true
