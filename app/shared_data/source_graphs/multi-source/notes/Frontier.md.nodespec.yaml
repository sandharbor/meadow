nodespecs:
  - bundle: multi-source-page
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - source: reference
            linkPath: /Study.md
            isInGraph: true
          - source: reference
            linkPath: /Appendix.md
            isInGraph: true
        inlinks:
          - linkPath: /Start.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: ../reference/Study.html
          - relativeLinkPath: ../reference/Appendix.html
        footerSectionBacklinks:
          - relativeLinkPath: Start.html
            backlinkContexts:
              - seeInContextLinkRelativePath: Start.html
                embeddedLinks:
                  - linkName: Inside
                    linkRelativePath: Same/Inside.html
  - bundle: multi-source-mixed
    sourcing:
      isInWorkingGraph: true
      links:
        outlinks:
          - source: reference
            linkPath: /Study.md
            isInGraph: true
          - source: reference
            linkPath: /Appendix.md
            isInGraph: true
        inlinks:
          - linkPath: /Start.md
            isInGraph: true
    curation:
      isTracked: true
    generation:
      htmlRenderedLinks:
        mainSectionLinks:
          - relativeLinkPath: ../reference/Study.html
          - relativeLinkPath: ../reference/Appendix.html
        footerSectionBacklinks:
          - relativeLinkPath: Start.html
            backlinkContexts:
              - seeInContextLinkRelativePath: Start.html
                embeddedLinks:
                  - linkName: Inside
                    linkRelativePath: Same/Inside.html
  - bundle: multi-source-omitted
    sourcing:
      isInWorkingGraph: false
      frontierDepthOrNullForOrphan: 1
    curation:
      isTracked: false
    generation:
      htmlRenderedLinks:
        mainSectionLinks: []
        footerSectionBacklinks: []
