id: move-nested-group
label: Move several related pages
action: "Move all three t001 child pages together, leaving name-only links unchanged."
check: "Review proposes the three moves, and existing name-only links still resolve."
e2e: sourcing-move-group.spec.ts
categories: [move]
sourceGraph: meadow-test-bundles-data
operations:
  - move:
      from: t001/t001 ---- child 1.md
      to: source-changes/nested/t001 ---- child 1.md
  - move:
      from: t001/deeper/t001 ---- child 2.md
      to: source-changes/nested/deeper/t001 ---- child 2.md
  - move:
      from: t001/t001 ---- child 3 in same dir as child 1.md
      to: source-changes/nested/t001 ---- child 3 in same dir as child 1.md
