id: add-embedded-image
label: Add an embedded image
action: "Add a new image and embed it in the media page."
check: "Review shows the image thumbnail and the route that includes it."
e2e: sourcing-add-image.spec.ts
categories: [add]
sourceGraph: meadow-test-bundles-data
operations:
  - replaceText:
      path: t006 - embedded media.md
      before: "## PNG"
      after: "## Added image\n\n![[source-changes/added sunflower.png]]\n\n## PNG"
  - write:
      path: source-changes/added sunflower.png
      contentFile: sunflower.png
