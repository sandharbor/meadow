id: add-linked-page
label: Add a linked Markdown page
action: "Add a Markdown page and link to it from the main page."
check: "Review shows the new page and its inclusion route."
e2e: sourcing-track-new-pages.spec.ts
categories: [add]
sourceGraph: meadow-test-bundles-data
operations:
  - replaceText:
      path: main page.md
      before: "[[t001 - deeply nested]]"
      after: "[[t001 - deeply nested]]\n\n[[source-changes/added field notes]]"
  - write:
      path: source-changes/added field notes.md
      contentFile: added.md
