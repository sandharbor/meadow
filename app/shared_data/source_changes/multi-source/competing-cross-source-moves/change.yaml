id: competing-cross-source-moves
label: Create competing cross-source move candidates
action: "Replace `notes://Same/Inside.md` with two identical, reachable files in different sources."
check: "Review must not silently assign either one the old identity."
e2e: multi-source-competing-moves.spec.ts
categories:
  - move
  - add
  - remove
operations:
  - delete: notes/Same/Inside.md
  - write:
      path: research/Moved/Inside.md
      contentFile: Inside.md
  - write:
      path: reference/Moved/Inside.md
      contentFile: Inside.md
  - replaceText:
      path: notes/Start.md
      before: "[[Same/Inside]]"
      after: "[[Moved/Inside::research]] and [[Moved/Inside::reference]]"
sourceGraph: multi-source
