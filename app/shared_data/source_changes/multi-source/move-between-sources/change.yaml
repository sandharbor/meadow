id: move-between-sources
label: Move a page from notes to research
action: "Move `notes://Same/Inside.md` to `research://Moved/Inside.md` and update its incoming link."
check: "Review proposes a cross-source move and retains its identity and settings after acceptance."
e2e: multi-source-move.spec.ts
categories:
  - move
operations:
  - move:
      from: notes/Same/Inside.md
      to: research/Moved/Inside.md
  - replaceText:
      path: notes/Start.md
      before: "[[Same/Inside]]"
      after: "[[Moved/Inside::research]]"
sourceGraph: multi-source
